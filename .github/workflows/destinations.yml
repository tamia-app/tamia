name: Check-up des destinations
on:
  push:
    paths: ["data/**", "tools/check_destinations.py"]
  schedule:
    - cron: "17 7 1 * *"   # le 1er de chaque mois
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_destinations.py
